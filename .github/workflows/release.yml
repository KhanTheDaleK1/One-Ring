name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "macos-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid release tag '$TAG'. Expected vMAJOR.MINOR.PATCH with an optional -suffix."
            exit 1
          fi

      - name: Clean-room compliance check
        run: python3 scripts/check_clean_room.py
        env:
          ONE_RING_UPDATE_REPO: ${{ github.repository }}

      - name: install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_UPDATE_REPO: ${{ github.repository }}
          ONE_RING_UPDATE_REPO: ${{ github.repository }}

      - name: Verify native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          ONE_RING_UPDATE_REPO: ${{ github.repository }}

      - name: Set updater endpoints
        shell: bash
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "src-tauri/tauri.conf.json"
          with open(path, "r", encoding="utf-8") as f:
              cfg = json.load(f)
          repo = os.environ["UPDATE_REPO"]
          endpoint = f"https://github.com/{repo}/releases/latest/download/latest.json"
          updater = cfg.setdefault("plugins", {}).setdefault("updater", {})
          updater["endpoints"] = [endpoint]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
          print("Injected updater endpoint:", endpoint)
          PY

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_UPDATE_REPO: ${{ github.repository }}
          ONE_RING_UPDATE_REPO: ${{ github.repository }}
          ONE_RING_CRASH_RELAY_URL: ${{ secrets.ONE_RING_CRASH_RELAY_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "One Ring ${{ github.ref_name }}"
          releaseBody: "Automated installer bundle for Windows (.msi / .exe), macOS (.dmg / .app), and Android (.apk) with signed Tauri v2 auto-updater metadata."
          releaseDraft: false
          prerelease: true
