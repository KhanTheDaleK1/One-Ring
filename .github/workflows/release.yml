name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "macos-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      - name: Clean-room compliance check
        run: python3 scripts/check_clean_room.py
        env:
          ONE_RING_UPDATE_REPO: ${{ github.repository }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONE_RING_UPDATE_REPO: ${{ github.repository }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "One Ring ${{ github.ref_name }}"
          releaseBody: "Automated installer bundle for Windows (.msi / .exe) and macOS (.dmg / .app)."
          releaseDraft: false
          prerelease: true