name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "macos-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid release tag '$TAG'. Expected vMAJOR.MINOR.PATCH with an optional -suffix."
            exit 1
          fi

      - name: Clean-room compliance check
        run: python3 scripts/check_clean_room.py
        env:
          ONE_RING_UPDATE_REPO: ${{ github.repository }}

      - name: install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_UPDATE_REPO: ${{ github.repository }}
          ONE_RING_UPDATE_REPO: ${{ github.repository }}

      - name: Verify native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          ONE_RING_UPDATE_REPO: ${{ github.repository }}

      - name: Set updater endpoints
        run: python3 -c "
import json, sys
path = 'src-tauri/tauri.conf.json'
with open(path) as f:
    cfg = json.load(f)
plugins = cfg.setdefault('plugins', {})
updater = plugins.setdefault('updater', {})
endpoints = updater.setdefault('endpoints', [])
endpoint = 'https://github.com/${{ github.repository }}/releases/latest/download/latest.json'
if endpoint not in endpoints:
    endpoints.append(endpoint)
with open(path, 'w') as f:
    json.dump(cfg, f, indent=2)
"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_UPDATE_REPO: ${{ github.repository }}
          ONE_RING_UPDATE_REPO: ${{ github.repository }}
          ONE_RING_CRASH_RELAY_URL: ${{ secrets.ONE_RING_CRASH_RELAY_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "One Ring ${{ github.ref_name }}"
          releaseBody: "Automated installer bundle for Windows (.msi / .exe) and macOS (.dmg / .app). Alpha builds are unsigned; signed updater artifacts are planned for beta/GA."
          releaseDraft: false
          prerelease: true
